<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Warm Ivory Canvas Background -->
    <rect id="bg" width="100%" height="100%" fill="#F7F4EF"/>

    <!-- Subtle Radial Glows -->
    <radialGradient id="glowTopRight" cx="85%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#52B788" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#2D6A4F" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#F7F4EF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowBottomLeft" cx="15%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#D4A373" stop-opacity="0.07"/>
      <stop offset="60%" stop-color="#F7F4EF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowCoral" cx="90%" cy="40%" r="20%">
      <stop offset="0%" stop-color="#E07A5F" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#F7F4EF" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1B4332" stroke-width="0.75" stroke-opacity="0.035"/>
    </pattern>

    <!-- Node Gradient -->
    <linearGradient id="lineGradGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B4332" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#2D6A4F" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#52B788" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="lineGradBeige" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D4A373" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#2D6A4F" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  <!-- Base Ivory Background -->
  <rect width="100%" height="100%" fill="#F7F4EF"/>

  <!-- Radial Atmosphere Layers -->
  <rect width="100%" height="100%" fill="url(#glowTopRight)"/>
  <rect width="100%" height="100%" fill="url(#glowBottomLeft)"/>
  <rect width="100%" height="100%" fill="url(#glowCoral)"/>

  <!-- Fine Analytical Grid Overlay -->
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- ABSTRACT DATA-INTELLIGENCE NETWORK (CONCENTRATED AT EDGES) -->

  <!-- Top Right Analytical Ring & Curves -->
  <g opacity="0.85">
    <circle cx="1600" cy="200" r="320" fill="none" stroke="#2D6A4F" stroke-width="1" stroke-dasharray="4 8" stroke-opacity="0.12"/>
    <circle cx="1600" cy="200" r="220" fill="none" stroke="#D4A373" stroke-width="1" stroke-opacity="0.15"/>
    <circle cx="1600" cy="200" r="140" fill="none" stroke="#1B4332" stroke-width="0.75" stroke-opacity="0.10"/>

    <!-- Curved Flow Lines -->
    <path d="M 1200,50 Q 1450,180 1850,120" fill="none" stroke="url(#lineGradGreen)" stroke-width="1.5"/>
    <path d="M 1300,120 Q 1550,300 1900,280" fill="none" stroke="url(#lineGradGreen)" stroke-width="1.2"/>
    <path d="M 1100,0 Q 1400,240 1750,450" fill="none" stroke="url(#lineGradBeige)" stroke-width="1"/>

    <!-- Nodes & Signals -->
    <circle cx="1450" cy="180" r="3" fill="#2D6A4F" fill-opacity="0.3"/>
    <circle cx="1550" cy="300" r="4" fill="#52B788" fill-opacity="0.4"/>
    <circle cx="1750" cy="450" r="3" fill="#D4A373" fill-opacity="0.35"/>
    <!-- Tiny Risk Indicator Node -->
    <circle cx="1680" cy="240" r="3" fill="#E07A5F" fill-opacity="0.45"/>
    <circle cx="1680" cy="240" r="7" fill="none" stroke="#E07A5F" stroke-width="0.75" stroke-opacity="0.3"/>

    <!-- Interconnecting Subtle Lines -->
    <line x1="1450" y1="180" x2="1550" y2="300" stroke="#2D6A4F" stroke-width="0.75" stroke-opacity="0.12"/>
    <line x1="1550" y1="300" x2="1680" y2="240" stroke="#E07A5F" stroke-width="0.75" stroke-opacity="0.15"/>
    <line x1="1680" y1="240" x2="1750" y2="450" stroke="#D4A373" stroke-width="0.75" stroke-opacity="0.12"/>
  </g>

  <!-- Bottom Right Network Cluster -->
  <g opacity="0.8">
    <path d="M 1350,900 Q 1600,750 1920,850" fill="none" stroke="url(#lineGradGreen)" stroke-width="1.5"/>
    <path d="M 1150,1050 Q 1450,880 1800,1000" fill="none" stroke="url(#lineGradBeige)" stroke-width="1.2"/>
    
    <circle cx="1600" cy="750" r="3.5" fill="#2D6A4F" fill-opacity="0.35"/>
    <circle cx="1450" cy="880" r="3" fill="#52B788" fill-opacity="0.3"/>
    <circle cx="1780" cy="820" r="2.5" fill="#E07A5F" fill-opacity="0.4"/>
    
    <line x1="1450" y1="880" x2="1600" y2="750" stroke="#2D6A4F" stroke-width="0.75" stroke-opacity="0.10"/>
    <line x1="1600" y1="750" x2="1780" y2="820" stroke="#2D6A4F" stroke-width="0.75" stroke-opacity="0.10"/>
  </g>

  <!-- Bottom Left Analytical Cluster -->
  <g opacity="0.75">
    <circle cx="250" cy="850" r="240" fill="none" stroke="#D4A373" stroke-width="1" stroke-opacity="0.10" stroke-dasharray="6 6"/>
    <circle cx="250" cy="850" r="140" fill="none" stroke="#1B4332" stroke-width="0.75" stroke-opacity="0.08"/>

    <path d="M 0,700 Q 200,880 550,820" fill="none" stroke="url(#lineGradGreen)" stroke-width="1.2"/>
    <path d="M 50,950 Q 300,780 650,920" fill="none" stroke="url(#lineGradBeige)" stroke-width="1"/>

    <circle cx="200" cy="880" r="3.5" fill="#52B788" fill-opacity="0.35"/>
    <circle cx="300" cy="780" r="3" fill="#2D6A4F" fill-opacity="0.3"/>
    <circle cx="550" cy="820" r="2.5" fill="#D4A373" fill-opacity="0.4"/>

    <line x1="200" y1="880" x2="300" y2="780" stroke="#2D6A4F" stroke-width="0.75" stroke-opacity="0.12"/>
    <line x1="300" y1="780" x2="550" y2="820" stroke="#D4A373" stroke-width="0.75" stroke-opacity="0.10"/>
  </g>

  <!-- Top Left Minimal Curve -->
  <g opacity="0.6">
    <path d="M -50,250 Q 250,150 450,0" fill="none" stroke="url(#lineGradGreen)" stroke-width="1"/>
    <circle cx="250" cy="150" r="3" fill="#2D6A4F" fill-opacity="0.25"/>
  </g>

  <!-- Subtle Outer Frame Vignette Glow -->
  <rect width="100%" height="100%" fill="none" stroke="#1B4332" stroke-width="1" stroke-opacity="0.03"/>
</svg>
